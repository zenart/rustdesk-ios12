name: iPad iOS12 build
on:
  push:
    branches: [ipad-ios12]
  workflow_dispatch:
env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.19.6"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  VCPKG_COMMIT_ID: "1de2026f28ead93ff1773e6e680387643e914ea1"
  VCPKG_BINARY_SOURCES: "clear"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_NET_RETRY: "10"
  LIBTAILSCALE_COMMIT: "dacde75057ff350e146505829beff446e6823966"
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode
          for v in 16.4 16.3 16.2 16.1 16.0; do [ -d /Applications/Xcode_$v.app ] && { sudo xcode-select -s /Applications/Xcode_$v.app; break; }; done
          xcodebuild -version
      - name: Install tools
        run: |
          brew install nasm yasm
          # stare vcpkg potrebuje CMake 3.x (CMake 4 uz nenastavuje CMAKE_OSX_SYSROOT)
          brew uninstall --ignore-dependencies cmake || true
          pipx install cmake==3.29.6
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          ~/.local/bin/cmake --version
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Cache vcpkg
        id: vcpkgcache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/vcpkg
          key: vcpkg-ios12-${{ env.VCPKG_COMMIT_ID }}-${{ hashFiles('vcpkg.json', 'res/vcpkg/**', 'res/vcpkg-triplets/**') }}
      - name: Build vcpkg dependencies
        run: |
          if [ ! -x ~/vcpkg/vcpkg ]; then
            git clone https://github.com/microsoft/vcpkg ~/vcpkg
            git -C ~/vcpkg checkout $VCPKG_COMMIT_ID
            ~/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          fi
          echo "VCPKG_ROOT=$HOME/vcpkg" >> $GITHUB_ENV
          if ! ~/vcpkg/vcpkg install --triplet arm64-ios --overlay-triplets=res/vcpkg-triplets --x-install-root="$HOME/vcpkg/installed"; then
            find ~/vcpkg/buildtrees -name "*.log" -newer vcpkg.json | while read -r f; do echo "== $f"; tail -60 "$f"; done
            exit 1
          fi
          rm -rf ~/vcpkg/buildtrees ~/vcpkg/downloads ~/vcpkg/packages
      - name: Save vcpkg cache
        if: steps.vcpkgcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/vcpkg
          key: ${{ steps.vcpkgcache.outputs.cache-primary-key }}
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ipad-ios12
          cache-on-failure: true
      - name: Generate flutter rust bridge
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable install flutter_rust_bridge_codegen --version $FLUTTER_RUST_BRIDGE_VERSION --features "uuid" --locked
          # url_launcher_ios 6.2.4 nejde prelozit s Xcode 16 (iOS 18 SDK)
          (cd flutter && flutter pub get && flutter pub upgrade url_launcher_ios && grep -A8 '^  url_launcher_ios:' pubspec.lock | grep version)
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/ios/Runner/bridge_generated.h
      - name: Build rustdesk lib
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "12.0"
        run: cargo build --features flutter,hwcodec --release --target aarch64-apple-ios --lib
      - name: Cache libtailscale
        id: tscache
        uses: actions/cache@v4
        with:
          path: flutter/ios/libtailscale_ios.a
          key: libtailscale-ios-${{ env.LIBTAILSCALE_COMMIT }}
      - name: Checkout libtailscale
        if: steps.tscache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/tailscale/libtailscale ~/libtailscale
          git -C ~/libtailscale checkout $LIBTAILSCALE_COMMIT
      - uses: actions/setup-go@v5
        if: steps.tscache.outputs.cache-hit != 'true'
        with:
          go-version: stable
          cache: false
      - name: Build libtailscale for iOS
        if: steps.tscache.outputs.cache-hit != 'true'
        run: |
          cd ~/libtailscale
          export GOTOOLCHAIN=auto
          go version
          make c-archive-ios
          ls -lh libtailscale_ios.a
          cp libtailscale_ios.a $GITHUB_WORKSPACE/flutter/ios/libtailscale_ios.a
      - name: Build app
        run: |
          cd flutter
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=12.0 -c ios/ios12_compat.c -o ios/ios12_compat.o
          flutter build ios --release --no-codesign
      - name: Package IPA
        run: |
          APP=flutter/build/ios/iphoneos/Runner.app
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" $APP/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" $APP/Info.plist
          for b in $APP/Runner $APP/Frameworks/*.framework/*; do
            [ -f "$b" ] && file "$b" | grep -q Mach-O && echo "$b: $(otool -l "$b" | grep -A4 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_IPHONEOS' | grep -E 'minos|version ' | head -1)"
          done
          if nm -m $APP/Runner | grep -E "undefined.*kSecUseDataProtectionKeychain"; then echo "symbol stale chybi"; exit 1; fi
          mkdir Payload && cp -R $APP Payload/
          zip -qry rustdesk-ios12.ipa Payload
          ls -lh rustdesk-ios12.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: rustdesk-ios12
          path: rustdesk-ios12.ipa
